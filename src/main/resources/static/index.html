<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>BookNest</title>

    <link rel="stylesheet"
    href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <h1 class="logo">
        BookNest 📚
    </h1>

    <ul>

        <li>
            <a href="#home">Home</a>
        </li>

        <li>
            <a href="#books">Books</a>
        </li>

        <li>
            <a href="#cart">Cart</a>
        </li>

        <li>

            <button class="logout-btn"
            onclick="logout()">

                Logout

            </button>

        </li>

    </ul>

</nav>

<!-- HERO -->

<section class="hero"
id="home">

    <div class="hero-text">

        <h1>
            Discover Your Next Favorite Book
        </h1>

        <p>
            Explore programming, development and technology books.
        </p>

        <input type="text"
        id="searchInput"
        placeholder="Search books...">

    </div>

</section>

<!-- BOOK SECTION -->

<section class="books-section"
id="books">

    <h2 class="section-title">

        Popular Books

    </h2>

    <div class="books-container"
    id="booksContainer">

    </div>

</section>

<!-- CART SECTION -->

<section class="cart-section"
id="cart">

    <h2>
        Your Cart 🛒
    </h2>

    <div id="cartItems">

    </div>

    <h3 class="cart-total">

        Total:
        ₹<span id="totalPrice">0</span>

    </h3>

    <button class="checkout-btn"
    onclick="goToCheckout()">

        Checkout

    </button>

</section>

<script src="script.js"></script>

</body>

</html>
